{{ if .Site.Params.technologies.enabled }}
<div class="w-full">
  {{ partialCached "helper/section-header.html" (dict "title" .Site.Params.technologies.title "eyebrow" "Stack") .Site.Params.technologies.title }}
  <div class="grid grid-cols-3 sm:grid-cols-6 lg:grid-cols-12 gap-2.5" data-reveal-group data-reveal-stagger="45">
    {{ range .Site.Params.technologies.main }}
    <a href="{{ .url }}" alt="{{ .name }}" aria-label="{{ .name }}" data-reveal="scale"
      class="group oui-card !rounded-2xl aspect-square flex items-center justify-center overflow-hidden p-4 card-glow"
      rel="noopener" target="_blank">

      <img src="{{ .image | safeURL }}" alt="{{ .name }}" class="max-h-full max-w-full object-contain transition-transform duration-300 ease-out group-hover:scale-105" loading="lazy"
        decoding="async" title="{{ .name }}">

    </a>
    {{ end }}
  </div>

</div>
{{ end }}
