{{ define "main" }}
<section class="grow flex flex-col items-center justify-center text-center px-4 py-16 pt-24">
  <span class="oui-eyebrow mb-6">Error 404</span>
  <h1 class="oui-display text-7xl md:text-9xl leading-none">404</h1>
  <p class="text-2xl md:text-[28px] font-semibold mt-4" style="color:var(--oui-text-strong)">Página no encontrada</p>
  <p class="oui-body text-[16px] max-w-xl mt-3 mb-8">
    El enlace que seguiste no existe o se movió. Volvé al inicio o explorá el blog.
  </p>
  <div class="flex flex-wrap justify-center gap-3">
    <a href="{{ "/" | relLangURL }}" class="oui-button-brand">Volver al inicio</a>
    <a href="{{ "/posts" | relLangURL }}" class="oui-button-secondary">Ver el blog</a>
  </div>
</section>
{{ end }}
