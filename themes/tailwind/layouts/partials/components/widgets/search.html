<div id="search-wrapper"
  class="fixed inset-0 flex h-screen w-screen cursor-default flex-col bg-black/60 p-4 backdrop-blur-sm sm:p-6 md:p-[10vh] lg:p-[12vh] opacity-0 invisible pointer-events-none transition-opacity duration-300 ease-in-out "
  data-url="{{ "" | absLangURL }}" style="z-index:500">
  <div id="search-modal" role="dialog" aria-modal="true" aria-label="Buscar en el sitio"
    class="flex flex-col w-full max-w-3xl min-h-0 mx-auto border border-zinc-200/10 rounded-xl shadow-lg top-20 background opacity-0 translate-y-4 transition-all duration-300 ease-in-out ">
    <header class="relative z-10 flex items-center justify-between flex-none px-2">
      <form class="flex items-center flex-auto min-w-0" role="search">
        <div class="flex items-center justify-center w-11 h-11 text-white/50">
          <em class="fas fa-search text-2xl" aria-hidden="true"></em>
        </div>
        <input type="search" id="search-query" aria-label="Buscar"
          class="flex flex-auto h-12 mx-1 bg-transparent appearance-none"
          placeholder="Buscar..." tabindex="0" />
      </form>
      <button id="close-search-button" aria-label="Cerrar búsqueda"
        class="flex items-center justify-center w-11 h-11 text-white/60 hover:text-fuchsia-400 transition-colors"
        title="Cerrar">
        <em class="fas fa-xmark text-2xl" aria-hidden="true"></em>
      </button>
    </header>
    <section class="flex-auto px-2 overflow-auto">
      <ul id="search-results">
      </ul>
    </section>
  </div>
</div>
