# Política de seguridad de Hugo.
# Desde Hugo 0.165 el transform de Tailwind CSS v4 ejecuta el binario
# `tailwindcss`, que debe estar explícitamente permitido en exec.allow
# (la lista reemplaza a la default, así que se incluyen también los binarios
# que Hugo usa por defecto: sass, go, git, node, npx, postcss).
exec:
  allow:
    - ^(dart-)?sass$
    - ^go$
    - ^git$
    - ^node$
    - ^npx$
    - ^postcss$
    - ^tailwindcss$
