{{ define "main" }}
<section class="grow flex flex-col items-center justify-center text-center px-4 py-24">
  <div class="badge-pill mb-6">Error 404</div>
  <h1 class="text-7xl md:text-9xl font-bold text-gradient leading-none pb-2">404</h1>
  <p class="text-2xl md:text-3xl font-bold text-white mt-4">Página no encontrada</p>
  <p class="text-white/60 text-lg max-w-xl mt-3 mb-8">
    El enlace que seguiste no existe o se movió. Volvé al inicio o explorá el blog.
  </p>
  <div class="flex flex-wrap justify-center gap-4">
    <a href="{{ "/" | relLangURL }}" class="btn-primary">Volver al inicio</a>
    <a href="{{ "/posts" | relLangURL }}" class="btn-outline">Ver el blog</a>
  </div>
</section>
{{ end }}
