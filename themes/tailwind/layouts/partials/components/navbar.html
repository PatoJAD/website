<header class="w-full flex justify-center z-20 fixed top-0 pt-3 px-4" style="height:4.5rem">
  <nav
    class="oui-nav px-2.5 py-1.5 pl-4 flex align-middle justify-between w-full">
    <a href="{{ "/" | relLangURL }}" class="my-auto flex items-center shrink-0" aria-label="PatoJAD — Inicio">
      <img src="/img/logo-patojad.png" title="PatoJAD" alt="PatoJAD"
        width="120" height="39" sizes="120px" loading="eager" decoding="async" fetchpriority="high" />
    </a>
    <div class="ml-auto mr-auto hidden md:flex flex-wrap items-center gap-1 px-4">
      {{ range .Site.Menus.main }}
      {{ $active := $.IsMenuCurrent "main" . }}
      <a href="{{ .URL | relLangURL }}" {{ if eq .Params.newtab true }}target="_blank" rel="noopener" {{ end }} title="{{- .Name -}} "
        {{ if $active }}aria-current="page"{{ end }}
        class="oui-nav-link px-3 py-2 {{ if $active }}oui-nav-link-active{{ end }}">
        <span> {{- .Name -}} </span>
      </a>
      {{ end }}
    </div>
    <div class="md:hidden ml-auto mr-auto flex items-center">
      <button id="mobile-menu-button" aria-label="Abrir menú" aria-controls="mobile-menu-modal" aria-expanded="false"
        class="oui-icon-button !w-10 !h-10 !border-0 !bg-transparent" title="Menú">
        <em class="fas fa-bars" aria-hidden="true"></em>
      </button>
    </div>
    <div class="flex items-center gap-2">
      <button id="search-button" aria-label="Buscar"
        class="oui-icon-button !w-10 !h-10" title="Buscar">
        <em class="fas fa-search text-sm" aria-hidden="true"></em>
      </button>
    </div>
  </nav>
</header>

<div id="mobile-menu-modal"
  class="fixed inset-0 z-20 flex justify-center align-middle opacity-0 invisible pointer-events-none transition-opacity duration-300 ease-in-out "
  aria-hidden="true">
  <div id="mobile-menu-overlay"
    class="absolute inset-0 bg-black/60 backdrop-blur-sm opacity-0 transition-opacity duration-300 ease-in-out "></div>
  <div id="mobile-menu-panel" role="dialog" aria-modal="true" aria-label="Menú de navegación"
    class="absolute inset-x-0 top-0 mt-28 mx-auto w-[92%] max-w-md oui-dialog p-3 opacity-0 translate-y-4 transition-all duration-300 ease-in-out ">
    <div class="flex items-center justify-between px-2">
      <span class="oui-eyebrow">Menú</span>
      <button id="mobile-menu-close" aria-label="Cerrar menú" class="oui-icon-button !w-10 !h-10 !border-0 !bg-transparent" title="Cerrar">
        <em class="fas fa-times" aria-hidden="true"></em>
      </button>
    </div>
    <div class="mt-2 flex flex-col gap-1">
      {{ range .Site.Menus.main }}
      {{ $active := $.IsMenuCurrent "main" . }}
      <a href="{{ .URL | relLangURL }}" {{ if eq .Params.newtab true }}target="_blank" rel="noopener" {{ end }} title="{{- .Name -}} "
        {{ if $active }}aria-current="page"{{ end }}
        class="oui-nav-link !px-4 !py-3 !text-[14px] {{ if $active }}oui-nav-link-active{{ end }}">
        <span>{{- .Name -}}</span>
      </a>
      {{ end }}
    </div>
  </div>
</div>
