{{ $pages := .Site.Pages.ByPublishDate.Reverse }}
{{ range .Params.authors }}
{{ range where (where $pages "Type" "authors") ".Params.name" . }}

<div class="overflow-hidden mb-8 oui-card p-5">
  <div class="grid grid-cols-1 md:grid-cols-[120px_minmax(0,1fr)] gap-5 items-start">
    <!-- Left: avatar Once UI -->
    <div class="rounded-full overflow-hidden aspect-square w-[120px] mx-auto md:mx-0 shrink-0" style="border:1px solid var(--oui-border-medium)">
      <img src="{{ .Params.photo }}" alt="{{ .Params.name }}" loading="lazy" decoding="async"
        class="w-full h-full object-cover block" />
    </div>

    <!-- Right: content -->
    <div class="min-w-0">
      <span class="oui-eyebrow">Autor</span>
      <h2 class="text-xl md:text-2xl font-semibold mt-1" style="color:var(--oui-text-strong)">
        {{ .Params.name}}
      </h2>
      <h3 class="text-[14px] font-medium mt-1" style="color:var(--oui-brand-300)">
        {{ .Params.descriptionp }}
      </h3>

      <div class="mt-3">
        <p class="text-[14px] leading-relaxed p-0" style="color:var(--oui-text-default)">{{ .Params.description | default "" }}</p>
      </div>
    </div>
  </div>
</div>

{{ end }}
{{ end }}
