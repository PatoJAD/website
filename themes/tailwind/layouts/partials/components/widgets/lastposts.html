<div class="w-full mb-4">
  {{ partialCached "helper/section-header.html" (dict "title" "Últimos Artículos") "Últimos Artículos" }}
  {{ $posts := first 2 .Site.RegularPages.ByDate.Reverse }}
  <div class="grid grid-cols-1 sm:grid-cols-2 gap-4" data-reveal-group data-reveal-stagger="110">
    {{ range $posts }}
      {{ .Render "card" }}
    {{ end }}
  </div>
</div>
